[project]
name = "maint-copilot"
version = "0.1.0"
description = "Predictive maintenance MLOps and RAG copilot"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dvc[s3]>=3.0",
    "mlflow>=2.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pre-commit>=3.8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
